<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@BankrollGuyAZ — Contact</title>
<meta name="description" content="Connect with @BankrollGuyAZ — Twitter, Telegram, Discord.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f3ec;
    --ink: #191919;
    --red: #c8322b;
    --rule: rgba(25,25,25,0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    /* subtle paper grain */
    background-image: radial-gradient(rgba(25,25,25,0.035) 1px, transparent 1px);
    background-size: 5px 5px;
  }

  .ticket {
    width: 100%;
    max-width: 420px;
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    position: relative;
  }

  .ticket-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 2px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
  }
  .ticket-head .label {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .ticket-head .label b { color: #f0c9c6; font-weight: 700; }

  .identity {
    padding: 26px 18px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--rule);
  }
  .avatar {
    width: 72px;
    height: 72px;
    flex: 0 0 72px;
    border: 2px solid var(--ink);
    border-radius: 50%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--red);
    color: var(--paper);
    font-family: 'Libre Franklin', sans-serif;
    font-weight: 900;
    font-size: 34px;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name h1 {
    font-family: 'Libre Franklin', sans-serif;
    font-weight: 900;
    font-size: clamp(17px, 5.2vw, 24px);
    line-height: 1.05;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .name .sub {
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--red);
    font-weight: 700;
  }

  .lines { padding: 6px 18px 4px; }
  .line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px dashed var(--rule);
  }
  .line:last-child { border-bottom: none; }
  .line .meta { min-width: 0; }
  .line .channel {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(25,25,25,0.55);
  }
  .line .handle {
    font-weight: 700;
    font-size: 15px;
    margin-top: 3px;
    word-break: break-all;
  }

  .btn {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--ink);
    padding: 9px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.12s ease, color 0.12s ease, transform 0.08s ease;
  }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn:active { transform: translate(1px, 1px); }
  .btn:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

  .save-wrap { padding: 16px 18px 22px; }
  .btn-save {
    display: block;
    width: 100%;
    background: var(--red);
    border-color: var(--red);
    color: var(--paper);
    font-size: 14px;
    padding: 15px 14px;
    text-align: center;
  }
  .btn-save:hover { background: var(--ink); border-color: var(--ink); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(8px);
    background: var(--ink);
    color: var(--paper);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 18px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .btn, .toast { transition: none; }
  }
</style>
</head>

<script>
  // --- Discord copy ---
  const toast = document.getElementById('toast');
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  document.getElementById('copyDiscord').addEventListener('click', async () => {
    const username = '.tropius';
    try {
      await navigator.clipboard.writeText(username);
      showToast('Discord username copied');
    } catch (e) {
      // fallback for older browsers
      const ta = document.createElement('textarea');
      ta.value = username;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Discord username copied');
    }
  });

  // --- vCard download ---
  document.getElementById('saveContact').addEventListener('click', () => {
    const vcf = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'FN:BankrollGuyAZ',
      'N:;BankrollGuyAZ;;;',
      'ORG:BankrollGuyAZ',
      'URL;TYPE=Twitter:https://x.com/BankrollGuyAZ',
      'URL;TYPE=Telegram:https://t.me/BankrollGuyAZ',
      'X-SOCIALPROFILE;TYPE=twitter:https://x.com/BankrollGuyAZ',
      'X-SOCIALPROFILE;TYPE=telegram:https://t.me/BankrollGuyAZ',
      'NOTE:Twitter/X: @BankrollGuyAZ \\nTelegram: @BankrollGuyAZ \\nDiscord: .tropius \\nMet at BetBash',
      'END:VCARD'
    ].join('\r\n');

    const blob = new Blob([vcf], { type: 'text/vcard' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'BankrollGuyAZ.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Contact card downloaded');
  });
</script>
